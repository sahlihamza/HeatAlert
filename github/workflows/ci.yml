name: HeatAlert CI

on:
  push:
    branches:
      - main
      - deployment/docker

  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Laravel Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: heatalert
          MYSQL_USER: heatalert
          MYSQL_PASSWORD: heatalert_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uheatalert -pheatalert_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, bcmath, gd, zip
          coverage: none

      - name: Check PHP version
        run: php -v

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Configure database
        run: |
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=heatalert/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=heatalert/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=heatalert_password/' .env

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: tests

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t heatalert-app .