name: CI Pipeline - Build & Test

on:
  push:
    branches:
      - main
      - aziz
      - master
      - deployment/docker
  pull_request:
    branches:
      - main
      - master
      - deployment/docker
  workflow_dispatch:

jobs:
  # ============================================================================
  # JOB 1: Test & Lint (Continuous Integration)
  # ============================================================================
  ci:
    name: Run Tests & Build Assets
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, gd, zip
          coverage: none

      - name: Validate composer.json & composer.lock
        run: composer validate --strict

      - name: Cache Composer Dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci || npm install
          npm run build

      - name: Check PHP Syntax (Lint)
        run: |
          find app routes config -name "*.php" -exec php -l {} \; > /dev/null
          echo "All PHP files have valid syntax!"

  # ============================================================================
  # JOB 2: Unit & Feature Tests (PHPUnit)
  # ============================================================================
  test:
    name: Run Unit & Feature Tests
    runs-on: ubuntu-24.04
    needs: ci

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, gd, zip
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Configure SQLite for Testing
        run: |
          touch database/database.sqlite
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=$(pwd)/database/database.sqlite" >> .env

      - name: Run Database Migrations
        run: php artisan migrate --force

      - name: Run Unit Tests
        run: php artisan test --testsuite=Unit --stop-on-failure

      - name: Run Feature Tests
        run: php artisan test --testsuite=Feature --stop-on-failure

