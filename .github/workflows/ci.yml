name: HeatAlert CI/CD

on:
  push:
    branches:
      - deployment/docker
  pull_request:
    branches:
      - deployment/docker

permissions:
  contents: read
  packages: write

concurrency:
  group: heatalert-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Test application
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: heatalert
          MYSQL_USER: heatalert
          MYSQL_PASSWORD: heatalert_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uheatalert -pheatalert_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: heatalert
      DB_USERNAME: heatalert
      DB_PASSWORD: heatalert_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, bcmath, gd, zip
          coverage: none

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear

      - name: Check PHP syntax
        run: find app routes config -name '*.php' -exec php -l {} \;

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run Laravel tests
        run: php artisan test

  build-and-deploy:
    name: Build image and deploy to Render
    runs-on: ubuntu-24.04
    needs: tests
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish commit image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/sahlihamza/heatalert:latest
            ghcr.io/sahlihamza/heatalert:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy this image to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_URL: ghcr.io/sahlihamza/heatalert:sha-${{ github.sha }}
        shell: bash
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::GitHub Actions secret RENDER_DEPLOY_HOOK_URL is missing."
            exit 1
          fi

          if [[ ! "$RENDER_DEPLOY_HOOK_URL" =~ ^https://api\.render\.com/deploy/[^[:space:]]+$ ]]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is not a valid Render Deploy Hook URL. Copy the complete HTTPS URL from the Render service's Deploy Hook settings and replace the GitHub Actions secret."
            exit 1
          fi

          curl --globoff --fail --silent --show-error --get \
            --data-urlencode "imgURL=${IMAGE_URL}" \
            "$RENDER_DEPLOY_HOOK_URL"
