name: HeatAlert CI

on:
  push:
    branches:
      - deployment/docker
  pull_request:
    branches:
      - deployment/docker

permissions:
  contents: read

concurrency:
  group: heatalert-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Test application
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: heatalert
          MYSQL_USER: heatalert
          MYSQL_PASSWORD: heatalert_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uheatalert -pheatalert_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: heatalert
      DB_USERNAME: heatalert
      DB_PASSWORD: heatalert_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, bcmath, gd, zip
          coverage: none

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear

      - name: Check PHP syntax
        run: find app routes config -name '*.php' -exec php -l {} \;

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run Laravel tests
        run: php artisan test
